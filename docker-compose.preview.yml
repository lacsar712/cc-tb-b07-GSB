# Preview-only compose. Canonical ports remain 3192/8192/54392 in docker-compose.yml.
services:
  db:
    image: docker.m.daocloud.io/library/postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: tea_cup
    ports:
      - "54395:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d tea_cup"]
      interval: 3s
      timeout: 5s
      retries: 20

  web:
    build:
      context: ./backend
    ports:
      - "8195:8000"
    environment:
      DATABASE_URL: postgresql://app:app@db:5432/tea_cup
      FLASK_SECRET: tea-cupping-dev-secret
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: docker.m.daocloud.io/library/nginx:1.27-alpine
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "3195:80"
    depends_on:
      - web

volumes:
  pgdata:
